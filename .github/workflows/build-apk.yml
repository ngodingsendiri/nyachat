name: Build APK

# Menghasilkan APK Nyachat dari GitHub.
# - APK debug (langsung bisa diinstall) selalu dibuat dan diunggah sebagai artifact.
# - Saat push TAG r* (r1.0.0, r1.0.1, ...) -> otomatis dibuat GitHub Release berisi APK (link download permanen).
# - APK release (ditandatangani) otomatis dibuat kalau secrets keystore disiapkan:
#     KEYSTORE_BASE64    -> isi file keystore (.jks) dalam base64
#     KEYSTORE_PASSWORD  -> password keystore (STORE_PASSWORD)
#     KEY_PASSWORD       -> password key (alias "upload")
# - Nama artifact mengikuti versionName di app/build.gradle.kts (tidak perlu edit manual).

on:
  push:
    branches: [main]
    tags: ["r*"]
  workflow_dispatch:

permissions:
  contents: write

# Hanya satu build berjalan dalam satu waktu; push baru membatalkan yang antri.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cache Gradle & dependensi (termasuk artefak Robolectric android-all untuk
      # test snapshot UI) supaya CI tidak mengunduh ulang setiap kali.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # WAJIB 21: compileSdk 36 & test Robolectric butuh Java 21.
          # JDK 17 membuat test Robolectric gagal:
          #   "Android SDK 36 requires Java 21 (have Java 17)".
          java-version: "21"

      # debug.keystore DI-COMMIT di repo (lihat app/build.gradle.kts). Penting:
      # keystore harus STABEL antar build supaya SHA-1 penandatangan sama setiap
      # kali — kalau berubah, Google Sign-In Firebase menolak APK
      # ("gagal login"). Jangan ganti/hapus debug.keystore.

      # L11: versionName dibaca dari gradle.properties (satu sumber kebenaran),
      # fallback ke literal di build.gradle.kts untuk kompatibilitas.
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -oP '^appVersion=\K.*' gradle.properties | head -1)
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP 'appVersion: String = project\.findProperty\("appVersion"\) as String\? \?: "\K[^"]+' app/build.gradle.kts | head -1)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Gate kualitas: unit test & lint dijalankan SEBELUM build. Kalau gagal,
      # job berhenti dan tidak ada APK/AAB yang dihasilkan.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      # Snapshot UI (Roborazzi, P3-3): bandingkan render komponen inti dengan
      # baseline di app/src/test/snapshots/ — gagal kalau ada regresi visual.
      # Rekam ulang baseline dengan `./gradlew :app:recordRoborazziDebug` lalu
      # commit PNG barunya bersama perubahan UI.
      - name: Snapshot UI (Roborazzi verify)
        run: ./gradlew :app:verifyRoborazziDebug --no-daemon

      # Lint Firebase Security Rules (firestore.rules) tanpa emulator — pakai
      # plugin resmi Firebase (@firebase/eslint-plugin-security-rules). Config
      # ada di eslint.config.mjs; menolak rules yang membuka read/write publik.
      - name: Lint Firestore rules
        run: |
          npm ci
          npm run lint:rules

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nyachat-${{ steps.version.outputs.version }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build signed release APK (jika secrets keystore diset)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Keystore secrets belum diset — APK release dilewati (APK debug tetap tersedia)."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --no-daemon

      - name: Upload release APK (jika ada)
        uses: actions/upload-artifact@v4
        with:
          name: Nyachat-${{ steps.version.outputs.version }}-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      # AAB (Android App Bundle) adalah format resmi untuk upload ke Play Store.
      - name: Build signed release AAB (Play Store, jika secrets keystore diset)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Keystore secrets belum diset — AAB release dilewati."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          ./gradlew :app:bundleRelease --no-daemon

      - name: Upload release AAB (jika ada)
        uses: actions/upload-artifact@v4
        with:
          name: Nyachat-${{ steps.version.outputs.version }}-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Buat GitHub Release (khusus tag v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Nyachat ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false
          generate_release_notes: true
